name: CI

# Runs on the owner's local self-hosted macOS (Apple Silicon) runner — the same
# machine the plugin targets (Logic Pro / M-series). Cloud macOS minutes are
# avoided and the JUCE/Catch2 dependency tree stays warm between runs.
on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch cancels the older, still-running job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: [self-hosted, macOS]
    steps:
      # clean: false keeps the gitignored build/ dir so JUCE + the object files
      # persist across runs (incremental builds instead of a full rebuild).
      - uses: actions/checkout@v4
        with:
          clean: false

      # launchd's default PATH omits Homebrew; expose the local toolchain.
      - name: Set up toolchain PATH
        run: |
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "/usr/local/opt/llvm/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          cmake --version | head -1
          ninja --version
          clang-format --version

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: clang-format gate
        run: clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.h')
